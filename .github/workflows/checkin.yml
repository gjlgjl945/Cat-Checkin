name: 多平台每日签到

# 运行时基线（2026-10 更新）
#   - 官方 Action 统一升到 v7 系列：runs.using 为 node24，规避 Node 20 弃用告警
#   - 运行器显式固定 ubuntu-24.04：ubuntu-latest 自 2026-10-19 起逐步迁移到 Ubuntu 26，
#     固定镜像可避免「某天突然换系统」导致的依赖/证书差异；验证通过后再整体切换
#   - 已无平台需要 Node.js：原顺丰脚本的 code.js 已随平台裁剪一并移除

# 触发方式
#   定时：北京时间每天 08:12 / 14:12（UTC 00:12 / 06:12）
#   手动：Actions → 本工作流 → Run workflow，可只跑指定平台或做 dry-run
on:
  schedule:
    - cron: "12 0,6 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "只运行指定平台，key 用英文逗号分隔（kanxue,wps,smzdm,trae），留空=全部已配置平台"
        required: false
        type: string
        default: ""
      dry_run:
        description: "只校验配置与依赖，不执行签到"
        required: false
        type: boolean
        default: false

# 同一分支只保留一条运行队列，避免定时与手动触发互相踩踏
concurrency:
  group: checkin-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # 关闭 Trae 脚本内置的启动随机抖动：CI 队列本身已错峰，抖动只会白占超时预算。
  # 脚本在 CI 环境下默认即为 0，这里显式写死便于排查；需要错峰改为 "600"。
  TRAE_JITTER_MAX: "0"

jobs:
  # 先做一次集中校验：配置有问题时快速失败，避免十多个平台 job 一起报错。
  #
  # 注意：本作业刻意不产出任何 job 输出（outputs）。GitHub 在作业结束时会把
  # 「疑似包含 Secret」的输出整条丢弃（日志里表现为 Skip output 'x' since it may
  # contain secret），而本作业加载了 TOKEN_JSON，由其派生的动态矩阵随时可能被误伤，
  # 一旦被丢弃，下游 fromJSON 只能拿到空串。改用静态矩阵后不再有这个耦合。
  prepare:
    name: 校验配置
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 还原运行配置
        uses: ./.github/actions/prepare-config
        with:
          token_json: ${{ secrets.TOKEN_JSON }}
          notification_json: ${{ secrets.NOTIFICATION_JSON }}

      - name: 校验配置结构
        run: python ci/platform_guard.py --validate

      - name: 列出本次要运行的平台
        env:
          # 定时触发时没有 inputs 上下文，用 event_name 显式兜底，避免依赖隐式空值行为
          SELECT: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || '' }}
        run: python ci/platform_guard.py --matrix --select "$SELECT"

  # 每个平台一个独立 job：互不影响、各自计时、失败可单独重跑
  checkin:
    name: ${{ matrix.name }}
    needs: prepare
    # 定时触发没有 inputs 上下文；条件写成「非 dispatch 或非 dry_run」两种情形都安全
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      # 静态矩阵：平台清单是代码常量，不依赖任何 job 输出。
      # 未配置账号、或被 dispatch 的 platforms 过滤掉的平台，由 ci/platform_guard.py
      # 在 job 内判定后跳过——位置放在装依赖之前，跳过的 job 只花十几秒。
      matrix:
        include:
          - { key: kanxue, name: 看雪论坛, entry: script/kanxue/sign_in.py, timeout: 300 }
          - { key: wps, name: WPS Office, entry: script/wps/main.py, timeout: 1500 }
          - { key: smzdm, name: 什么值得买, entry: script/smzdm/sign_daily_task/main.py, timeout: 1500 }
          - { key: trae, name: Trae CN, entry: script/trae/main.py, timeout: 900 }
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 还原运行配置
        uses: ./.github/actions/prepare-config
        with:
          token_json: ${{ secrets.TOKEN_JSON }}
          notification_json: ${{ secrets.NOTIFICATION_JSON }}

      - name: 判断该平台是否已配置
        id: guard
        env:
          # 手动触发时可用 platforms 输入只跑指定平台；留空表示全部
          SELECT: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || '' }}
        run: python ci/platform_guard.py --platform "${{ matrix.key }}" --select "$SELECT"

      - name: 执行签到
        if: steps.guard.outputs.configured == 'true'
        env:
          ENTRY_TIMEOUT_SECONDS: ${{ matrix.timeout }}
          RETRY_MAX: ${{ vars.CHECKIN_RETRY_MAX || '1' }}
          RETRY_DELAY_SECONDS: ${{ vars.CHECKIN_RETRY_DELAY_SECONDS || '15' }}
          # ---- 推送配置（二选一：NOTIFICATION_JSON Secret 或下列环境变量）----
          BARK_PUSH: ${{ secrets.BARK_PUSH || vars.BARK_PUSH }}
          BARK_ICON: ${{ secrets.BARK_ICON || vars.BARK_ICON }}
          BARK_SOUND: ${{ secrets.BARK_SOUND || vars.BARK_SOUND }}
          BARK_GROUP: ${{ secrets.BARK_GROUP || vars.BARK_GROUP }}
          BARK_LEVEL: ${{ secrets.BARK_LEVEL || vars.BARK_LEVEL }}
          BARK_URL: ${{ secrets.BARK_URL || vars.BARK_URL }}
          SCKEY: ${{ secrets.SCKEY || vars.SCKEY }}
          SENDKEY: ${{ secrets.SENDKEY || vars.SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || vars.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC || vars.PUSHPLUS_TOPIC }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN || vars.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID || vars.TG_USER_ID }}
          TG_API_HOST: ${{ secrets.TG_API_HOST || vars.TG_API_HOST }}
          FSKEY: ${{ secrets.FSKEY || vars.FSKEY }}
          DINGTALK_ACCESS_TOKEN: ${{ secrets.DINGTALK_ACCESS_TOKEN || vars.DINGTALK_ACCESS_TOKEN }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET || vars.DINGTALK_SECRET }}
          QYWX_KEY: ${{ secrets.QYWX_KEY || vars.QYWX_KEY }}
          QYWX_ORIGIN: ${{ secrets.QYWX_ORIGIN || vars.QYWX_ORIGIN }}
          GOTIFY_URL: ${{ secrets.GOTIFY_URL || vars.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN || vars.GOTIFY_TOKEN }}
          NTFY_URL: ${{ secrets.NTFY_URL || vars.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
          PUSHDEER_PUSHKEY: ${{ secrets.PUSHDEER_PUSHKEY || vars.PUSHDEER_PUSHKEY }}
        run: bash ci/run_entry.sh "${{ matrix.entry }}"

      - name: 写入任务摘要
        if: always()
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 平台 key | \`${{ matrix.key }}\` |"
            echo "| 入口 | \`${{ matrix.entry }}\` |"
            echo "| 是否已配置 | ${{ steps.guard.outputs.configured }} |"
            echo "| 账号数 | ${{ steps.guard.outputs.account_count }} |"
            echo "| 单平台超时 | ${{ matrix.timeout }}s |"
            echo "| 任务状态 | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 只上传脚本自身产生的运行日志；config/ 内含凭据，任何情况下都不作为工件上传
      - name: 上传运行日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.key }}
          path: |
            **/*.log
          if-no-files-found: ignore
          retention-days: 7
