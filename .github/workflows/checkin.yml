name: 多平台每日签到

# 运行时基线（2026-10 更新）
#   - 官方 Action 统一升到 v7 系列：runs.using 为 node24，规避 Node 20 弃用告警
#   - 运行器显式固定 ubuntu-24.04：ubuntu-latest 自 2026-10-19 起逐步迁移到 Ubuntu 26，
#     固定镜像可避免「某天突然换系统」导致的依赖/证书差异；验证通过后再整体切换
#   - 已无平台需要 Node.js：原顺丰脚本的 code.js 已随平台裁剪一并移除

# 触发方式
#   定时：北京时间每天 08:12 / 14:12（UTC 00:12 / 06:12）
#   手动：Actions → 本工作流 → Run workflow，可只跑指定平台或做 dry-run
on:
  schedule:
    - cron: "12 0,6 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "只运行指定平台，key 用英文逗号分隔（kanxue,wps,smzdm,trae），留空=全部已配置平台"
        required: false
        type: string
        default: ""
      dry_run:
        description: "只校验配置与依赖，不执行签到"
        required: false
        type: boolean
        default: false

# 同一分支只保留一条运行队列，避免定时与手动触发互相踩踏
concurrency:
  group: checkin-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # 平台脚本把结果写到这里，由「汇总推送」作业合并成一条通知。
  # 设置了这个变量，脚本就不会自己发推送（本地不加则照旧直接发）。
  CHECKIN_RESULT_DIR: .checkin-results
  # 关闭 Trae 脚本内置的启动随机抖动：CI 队列本身已错峰，抖动只会白占超时预算。
  # 脚本在 CI 环境下默认即为 0，这里显式写死便于排查；需要错峰改为 "600"。
  TRAE_JITTER_MAX: "0"

jobs:
  # 先做一次集中校验：配置有问题时快速失败，避免十多个平台 job 一起报错。
  #
  # 注意：本作业刻意不产出任何 job 输出（outputs）。GitHub 在作业结束时会把
  # 「疑似包含 Secret」的输出整条丢弃（日志里表现为 Skip output 'x' since it may
  # contain secret），而本作业加载了 TOKEN_JSON，由其派生的动态矩阵随时可能被误伤，
  # 一旦被丢弃，下游 fromJSON 只能拿到空串。改用静态矩阵后不再有这个耦合。
  prepare:
    name: 校验配置
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 还原运行配置
        uses: ./.github/actions/prepare-config
        with:
          # 每个平台一个 Secret：只改某个平台的账号时，只替换它自己的那份即可。
          # TOKEN_JSON 是旧用法（一份含多平台），动作会按平台自动拆开；同名平台以独立 Secret 优先。
          token_kanxue_json: ${{ secrets.TOKEN_KANXUE_JSON }}
          token_wps_json: ${{ secrets.TOKEN_WPS_JSON }}
          token_smzdm_json: ${{ secrets.TOKEN_SMZDM_JSON }}
          token_trae_json: ${{ secrets.TOKEN_TRAE_JSON }}
          token_json: ${{ secrets.TOKEN_JSON }}
          notification_json: ${{ secrets.NOTIFICATION_JSON }}

      - name: 校验配置结构
        run: python ci/platform_guard.py --validate

      # 平台注册表与工作流静态矩阵必须一致：否则「加了平台却没进矩阵」会静默不执行。
      # 这一步在起 4 个 job 之前就跑，漂移会在这里直接失败并给出修复命令。
      - name: 校验平台矩阵一致性
        run: python ci/platform_guard.py --check-matrix

      - name: 列出本次要运行的平台
        env:
          # 定时触发时没有 inputs 上下文，用 event_name 显式兜底，避免依赖隐式空值行为
          SELECT: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || '' }}
        run: python ci/platform_guard.py --matrix --select "$SELECT"

  # 每个平台一个独立 job：互不影响、各自计时、失败可单独重跑
  checkin:
    name: ${{ matrix.name }}
    needs: prepare
    # 定时触发没有 inputs 上下文；条件写成「非 dispatch 或非 dry_run」两种情形都安全
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      # 静态矩阵：平台清单是代码常量，不依赖任何 job 输出。
      # 未配置账号、或被 dispatch 的 platforms 过滤掉的平台，由 ci/platform_guard.py
      # 在 job 内判定后跳过——位置放在装依赖之前，跳过的 job 只花十几秒。
      matrix:
        include:
          # >>> PLATFORM_MATRIX（由 ci/platform_guard.py --sync-matrix 生成，勿手改）>>>
          - { key: kanxue, name: 看雪论坛, entry: script/kanxue/sign_in.py, timeout: 300 }
          - { key: wps, name: WPS Office, entry: script/wps/main.py, timeout: 1500 }
          - { key: smzdm, name: 什么值得买, entry: script/smzdm/sign_daily_task/main.py, timeout: 1500 }
          - { key: trae, name: Trae CN, entry: script/trae/main.py, timeout: 900 }
          # <<< PLATFORM_MATRIX <<<
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 还原运行配置
        uses: ./.github/actions/prepare-config
        with:
          # 每个平台一个 Secret：只改某个平台的账号时，只替换它自己的那份即可。
          # TOKEN_JSON 是旧用法（一份含多平台），动作会按平台自动拆开；同名平台以独立 Secret 优先。
          token_kanxue_json: ${{ secrets.TOKEN_KANXUE_JSON }}
          token_wps_json: ${{ secrets.TOKEN_WPS_JSON }}
          token_smzdm_json: ${{ secrets.TOKEN_SMZDM_JSON }}
          token_trae_json: ${{ secrets.TOKEN_TRAE_JSON }}
          token_json: ${{ secrets.TOKEN_JSON }}
          notification_json: ${{ secrets.NOTIFICATION_JSON }}

      - name: 判断该平台是否已配置
        id: guard
        env:
          # 手动触发时可用 platforms 输入只跑指定平台；留空表示全部
          SELECT: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || '' }}
        run: python ci/platform_guard.py --platform "${{ matrix.key }}" --select "$SELECT"

      - name: 执行签到
        if: steps.guard.outputs.configured == 'true'
        env:
          ENTRY_TIMEOUT_SECONDS: ${{ matrix.timeout }}
          RETRY_MAX: ${{ vars.CHECKIN_RETRY_MAX || '1' }}
          RETRY_DELAY_SECONDS: ${{ vars.CHECKIN_RETRY_DELAY_SECONDS || '15' }}
          # 推送不在这里发：脚本只把结果写成 JSON，由后面的「汇总推送」作业合并成一条。
          # 这样四个平台跑完只发 1 条，不会把 Server酱 免费额度（5 条/天）打爆。
        run: bash ci/run_entry.sh "${{ matrix.entry }}"

      - name: 写入任务摘要
        if: always()
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 平台 key | \`${{ matrix.key }}\` |"
            echo "| 入口 | \`${{ matrix.entry }}\` |"
            echo "| 是否已配置 | ${{ steps.guard.outputs.configured }} |"
            echo "| 账号数 | ${{ steps.guard.outputs.account_count }} |"
            echo "| 单平台超时 | ${{ matrix.timeout }}s |"
            echo "| 任务状态 | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 运行结果（不是凭据）：供「汇总推送」作业合并成一条通知
      - name: 上传运行结果
        if: always() && steps.guard.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.key }}
          path: ${{ env.CHECKIN_RESULT_DIR }}/
          if-no-files-found: ignore
          retention-days: 3

      # 只上传脚本自身产生的运行日志；config/ 内含凭据，任何情况下都不作为工件上传
      - name: 上传运行日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.key }}
          path: |
            **/*.log
          if-no-files-found: ignore
          retention-days: 7

  # 等所有平台跑完后合并结果，只推一条 Server酱 消息。
  # always() 是必要的：某个平台失败时仍要把「谁失败了」推出去，否则失败反而收不到通知。
  notify:
    name: 汇总推送
    needs: checkin
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 只为了拿到 Server酱 SendKey；账号配置不需要（汇总只看结果文件）
      - name: 还原推送配置
        uses: ./.github/actions/prepare-config
        with:
          notification_json: ${{ secrets.NOTIFICATION_JSON }}

      - name: 收集各平台结果
        uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: ${{ env.CHECKIN_RESULT_DIR }}
          merge-multiple: true

      - name: 合并推送
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY || secrets.SENDKEY }}
          # 与 checkin 用同一份 platforms 过滤，否则只跑一个平台时会把其余平台误报成「无结果」
          SELECT: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || '' }}
        run: |
          python ci/summarize.py --dir "$CHECKIN_RESULT_DIR" --select "$SELECT"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::汇总推送失败（退出码 $rc）"
            exit "$rc"
          fi
